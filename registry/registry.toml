# The gpuicn component registry.
#
# Every component is a self-contained Rust module in `ui/`. `gpuicn add <name>`
# copies its files (plus `registry_dependencies`, recursively) into your
# project, adds crates from `dependencies` with `cargo add`, and regenerates the
# `mod.rs` that declares them.
#
# `core = true` components are installed by `gpuicn init`.
# `init = true` components expose `pub fn init(cx: &mut App)`, which the
# generated `ui::init(cx)` calls.

