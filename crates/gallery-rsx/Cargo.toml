[package]
name = "gallery-rsx"
description = "Showcase of every gpuicn-rsx component, compiled straight from registry-rsx"
edition.workspace = true
license.workspace = true
version.workspace = true
publish = false

[dependencies]
# Only main.rs uses gpui directly: its `AssetSource` serves the bundled avatar
# photos to `rsx_gpui::App::assets`.
gpui = "0.2.2"
rsx = { version = "0.0.3", package = "rsxui" }
rsx-gpui = { version = "0.0.3", package = "rsxui-gpui" }
rsx-html = { version = "0.0.3", package = "rsxui-html" }

[build-dependencies]
rsx-build = { version = "0.0.3", package = "rsxui-build" }
rsx-core = { version = "0.0.3", package = "rsxui-core" }

[dev-dependencies]
gpui = { version = "0.2.2", features = ["test-support"] }
